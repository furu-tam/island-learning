<style>
/* Layout: trang vở ô ly, mỗi câu là một thẻ có sơ đồ dọc B1 → B2 → B3 → Đáp án, cạnh đó là ô "Bẫy hay gặp" */
:root{
  --paper:#f3f7fb; --grid:#dfe8f2; --card:#ffffff; --ink:#1d2b45; --muted:#5b6a83;
  --line:#c7d3e3; --blue:#2f6bd8; --blue-soft:#e4eeff;
  --green:#1f8a55; --green-soft:#e2f5ea; --red:#c8432b; --red-soft:#fdeae5;
  --yellow:#ffe27a; --l1:#2f9e6e; --l2:#2f6bd8; --l3:#b5541f;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121a27; --grid:#1a2536; --card:#18233a; --ink:#e8eef8; --muted:#9fb0c9;
  --line:#2c3b56; --blue:#7aa6ff; --blue-soft:#1f2f52;
  --green:#5fd39a; --green-soft:#173a2b; --red:#ff8c73; --red-soft:#3d2120;
  --yellow:#6b5a12; --l1:#5fd39a; --l2:#7aa6ff; --l3:#f0a06a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121a27; --grid:#1a2536; --card:#18233a; --ink:#e8eef8; --muted:#9fb0c9;
  --line:#2c3b56; --blue:#7aa6ff; --blue-soft:#1f2f52;
  --green:#5fd39a; --green-soft:#173a2b; --red:#ff8c73; --red-soft:#3d2120;
  --yellow:#6b5a12; --l1:#5fd39a; --l2:#7aa6ff; --l3:#f0a06a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px;max-width:62ch}
.howto{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:20px}
.howto b{font-family:var(--display);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:0 8px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1.5px solid var(--line);margin-bottom:20px;display:flex;flex-direction:column;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;cursor:pointer}
.tab{font-family:var(--display);font-weight:700;font-size:15px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toggle{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.toggle input{width:18px;height:18px;accent-color:var(--blue)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:0 0 auto;width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--display);font-weight:700;font-size:15px;display:grid;place-items:center;text-decoration:none}
.chip[data-l="1"]{border-bottom:3px solid var(--l1)} .chip[data-l="2"]{border-bottom:3px solid var(--l2)} .chip[data-l="3"]{border-bottom:3px solid var(--l3)}
.chip:hover{background:var(--blue-soft)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.level-head{font-family:var(--display);font-weight:800;font-size:24px;margin:36px 0 12px;display:flex;gap:10px;align-items:baseline}
.level-head small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:22px}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;scroll-margin-top:150px}
.card-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.qnum{flex:0 0 auto;font-family:var(--display);font-weight:800;font-size:20px;line-height:1;color:#fff;border-radius:10px;padding:9px 10px 7px;min-width:52px;text-align:center}
.card[data-l="1"] .qnum{background:var(--l1)} .card[data-l="2"] .qnum{background:var(--l2)} .card[data-l="3"] .qnum{background:var(--l3)}
:root[data-theme="dark"] .qnum{color:#0f1622}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qnum{color:#0f1622}}
.qtext{min-width:0}
.qtext p{margin:0;font-weight:500}
.qtext .opts{margin-top:4px;font-size:14px;color:var(--muted)}

.figs{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.fig{margin:0;width:112px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 8px 6px;text-align:center}
.fig.big{width:min(300px,100%)}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.fig figcaption{font-family:var(--display);font-weight:700;font-size:15px;margin-top:4px}
.fig.big figcaption{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted)}
.fig .s{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.fig .s.thin{stroke-width:1.4;stroke-dasharray:4 3}
.fig .f{fill:var(--ink)}
.fig .g{fill:var(--muted);stroke:none}
.fig text{fill:var(--ink);font-family:var(--display);font-weight:700;font-size:11px}
.fig .dim text{fill:var(--blue);font-family:var(--body);font-weight:600;font-size:9px}
.body{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
@media (max-width:720px){.body{grid-template-columns:minmax(0,1fr)}}

/* Sơ đồ dọc */
.flow{display:flex;flex-direction:column;align-items:stretch;max-width:520px}
.node{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card);position:relative}
.node.start{background:var(--blue-soft);border-color:var(--blue);border-style:dashed}
.node.start .lbl{color:var(--blue)}
.node.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:start}
.badge{font-family:var(--display);font-weight:800;font-size:17px;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;line-height:1}
.node .t{font-weight:600}
.node .d{font-size:15px;color:var(--muted);margin-top:2px}
.node .d mark{background:var(--yellow);color:var(--ink);padding:0 3px;border-radius:3px}
.calc{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.node.end{background:var(--green-soft);border-color:var(--green)}
.node.end .lbl{color:var(--green)}
.lbl{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.end .ans{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.25}
.arrow{height:30px;display:flex;justify-content:center;position:relative}
.arrow::before{content:"";width:3px;background:var(--line);height:22px}
.arrow::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top:9px solid var(--line);border-bottom:0}
.check{margin-top:6px;font-size:14px;color:var(--green);font-weight:600}

.trap{background:var(--red-soft);border:2px solid var(--red);border-radius:12px;padding:12px 14px}
.trap .lbl{color:var(--red);display:block;margin-bottom:6px}
.trap ul{margin:0;padding-left:18px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.tip{margin-top:12px;background:var(--blue-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.tip .lbl{color:var(--blue);display:block;margin-bottom:4px}

.hint-btn{margin-top:12px;font-family:var(--display);font-weight:700;font-size:16px;border:2px solid var(--blue);background:var(--blue);color:#fff;border-radius:10px;padding:6px 16px}
:root[data-theme="dark"] .hint-btn{color:#0f1622}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hint-btn{color:#0f1622}}
.hint-btn.reset{background:transparent;color:var(--blue)}
.hidden-step{display:none!important}
@media (prefers-reduced-motion:no-preference){.reveal{animation:pop .28s ease-out}@keyframes pop{from{opacity:.2;transform:translateY(-6px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <h1>Sơ đồ giải từng bước · Toán 6 giữa kì 1</h1>
  <p class="sub">30 câu trong đề thi thử, mỗi câu một sơ đồ đi từ trên xuống. Khi bé làm sai, mở đúng câu đó, cho bé đi lần lượt từng ô, xong mới xem ô đáp án. Ô đỏ bên cạnh ghi những chỗ bé hay nhầm.</p>
  <div class="howto"><b>Đề hỏi gì?</b>→<b>B1</b>→<b>B2</b>→<b>B3</b>→<b>Đáp án</b></div>

  <div class="bar">
    <div class="row">
      <button class="tab" data-f="all" aria-pressed="true">Tất cả</button>
      <button class="tab" data-f="1" aria-pressed="false">Level 1 · Dễ</button>
      <button class="tab" data-f="2" aria-pressed="false">Level 2 · Hình</button>
      <button class="tab" data-f="3" aria-pressed="false">Level 3 · Vận dụng</button>
      <label class="toggle" for="hintMode"><input type="checkbox" id="hintMode"> Che bước, mở dần</label>
    </div>
    <nav class="chips" id="chips" aria-label="Đi tới câu"></nav>
  </div>

  <main id="out"></main>
</div>

<script>
const LV = {1:["Level 1: Dễ","tập hợp, số tự nhiên, lũy thừa, chia hết"],2:["Level 2: Trung bình","hình học, chu vi, diện tích, đếm hình"],3:["Level 3: Vận dụng","tính hợp lí, tìm x, bài toán thực tế"]};
// steps: [việc cần làm, cách làm / phép tính]
const Q = [
{n:1,l:1,q:"Tập hợp nào sau đây chỉ tập hợp N*?",o:"A. {0;1;2;3;5;...} · B. {1;2;3;4} · C. {0;1;2;3;4;5} · D. {1;2;3;4;...}",
 s:[["Nhớ N* là gì","N* là số tự nhiên <mark>khác 0</mark>, nên bắt đầu từ 1."],
    ["Loại đáp án có số 0","A và C có số 0 → loại."],
    ["Xem có dấu “...” không","Số tự nhiên không có số cuối cùng, nên phải viết “...”. B dừng ở 4 → loại."]],
 a:"D. {1; 2; 3; 4; ...}",
 t:["Chọn A: nhầm N (có 0) với N* (không có 0).","Chọn B: quên dấu “...” ở cuối."]},
{n:2,l:1,q:"Tập hợp A các số tự nhiên lớn hơn 3 và nhỏ hơn 7 là?",o:"A. {3;4;5;6;7} · B. {4;5;6;7} · C. {3;4;5;6} · D. {4;5;6}",
 s:[["Gạch chân 2 điều kiện","“lớn hơn 3” và “nhỏ hơn 7”."],
    ["Tìm số bắt đầu","Lớn hơn 3 thì <mark>không lấy 3</mark> → bắt đầu từ 4."],
    ["Tìm số kết thúc","Nhỏ hơn 7 thì <mark>không lấy 7</mark> → dừng ở 6."],
    ["Viết tập hợp","<span class='calc'>A = {4; 5; 6}</span>"]],
 a:"D. A = {4; 5; 6}",
 t:["Nhầm “lớn hơn” với “lớn hơn hoặc bằng”, nên lấy cả 3 hoặc 7."]},
{n:3,l:1,q:"Tập hợp M = {x ∈ N* | x ≤ 3} gồm các phần tử?",o:"A. {0;1;2;3;4} · B. {1;2;3;4} · C. {0;1;2;3} · D. {1;2;3}",
 s:[["Đọc chữ N*","N* không có 0 → bắt đầu từ 1."],
    ["Đọc dấu ≤","≤ là “nhỏ hơn <mark>hoặc bằng</mark>” → được lấy 3."],
    ["Liệt kê","<span class='calc'>1, 2, 3</span>"]],
 a:"D. {1; 2; 3}",
 t:["Chọn C: quên N* không có 0.","Chọn B: lấy thêm 4, đọc sai dấu ≤."]},
{n:4,l:1,q:"Kết quả của 2³ là?",o:"A. 2 · B. 4 · C. 6 · D. 8",
 s:[["Đọc lũy thừa","2³: cơ số là 2, số mũ là 3."],
    ["Số mũ = số lần nhân","Viết 2 ra <mark>3 lần</mark> rồi nhân: <span class='calc'>2 × 2 × 2</span>"],
    ["Nhân lần lượt","<span class='calc'>2 × 2 = 4, rồi 4 × 2 = 8</span>"]],
 a:"D. 8",
 t:["Chọn C: lấy 2 × 3 = 6. Lũy thừa là nhân cơ số với chính nó, không phải nhân với số mũ."]},
{n:5,l:1,q:"Chỉ ra khẳng định SAI.",o:"A. 2³·2² = 2⁵ · B. 2⁴·2 = 2⁵ · C. 2⁶:2 = 2⁵ · D. 2³·2² = 2⁶",
 s:[["Nhớ 2 quy tắc","Nhân cùng cơ số → <mark>cộng</mark> số mũ. Chia cùng cơ số → <mark>trừ</mark> số mũ. Nhớ: 2 = 2¹."],
    ["Kiểm tra từng câu","A: 3+2 = 5 ✓ · B: 4+1 = 5 ✓ · C: 6−1 = 5 ✓ · D: 3+2 = 5, không phải 6 ✗"],
    ["Đọc lại đề","Đề hỏi câu <mark>SAI</mark> → chọn câu có dấu ✗."]],
 a:"D. 2³ · 2² = 2⁶",
 t:["Quên đề hỏi câu sai, chọn câu đúng đầu tiên.","Quên 2 = 2¹ nên thấy B, C lạ."]},
{n:6,l:1,q:"Số nào chia hết cho 3?",o:"A. 133 · B. 256 · C. 345 · D. 166",
 s:[["Nhớ dấu hiệu chia hết cho 3","<mark>Tổng các chữ số</mark> chia hết cho 3."],
    ["Cộng chữ số từng số","<span class='calc'>133 → 7 · 256 → 13 · 345 → 12 · 166 → 13</span>"],
    ["Tìm tổng chia hết cho 3","12 : 3 = 4 ✓"]],
 a:"C. 345",
 t:["Nhìn chữ số tận cùng như khi xét chia hết cho 2, 5. Với 3 và 9 phải cộng các chữ số."]},
{n:7,l:1,q:"Trong 1904; 2895; 2890; 2786, số chia hết cho 5 mà không chia hết cho 2 là?",o:"A. 1904 · B. 2895 · C. 2890 · D. 2786",
 s:[["Lọc lần 1: chia hết cho 5","Tận cùng 0 hoặc 5 → còn <span class='calc'>2895, 2890</span>"],
    ["Lọc lần 2: KHÔNG chia hết cho 2","Tận cùng phải là số lẻ → bỏ 2890 (tận cùng 0)."],
    ["Còn lại","<span class='calc'>2895</span>"]],
 a:"B. 2895",
 t:["Chọn C (2890): mới làm điều kiện thứ nhất, quên chữ “không chia hết cho 2”."]},
{n:8,l:1,q:"Ba số tự nhiên liên tiếp tăng dần a; 99; b. Tìm a, b.",o:"A. a=88; b=1 · B. a=98; b=101 · C. a=100; b=98 · D. a=98; b=100",
 s:[["Hiểu “liên tiếp tăng dần”","Số sau hơn số trước đúng 1 đơn vị."],
    ["Tìm a (đứng trước 99)","<span class='calc'>a = 99 − 1 = 98</span>"],
    ["Tìm b (đứng sau 99)","<span class='calc'>b = 99 + 1 = 100</span>"]],
 a:"D. a = 98; b = 100",
 t:["Chọn C: đảo ngược a và b, quên dãy đang tăng dần.","Chọn B: cộng nhầm 99 + 2."]},
{n:9,l:1,q:"Thay y để 591y chia hết cho cả 2 và 5.",o:"A. y = 0 · B. y = 2 · C. y = 4 · D. y = 5",
 s:[["Chia hết cho 2","Tận cùng: 0, 2, 4, 6, 8"],
    ["Chia hết cho 5","Tận cùng: 0, 5"],
    ["Tìm số có ở cả hai nhóm","Chỉ có <mark>0</mark> → y = 0"]],
 a:"A. y = 0",
 t:["Chọn D: số 5915 chỉ chia hết cho 5.","Chọn B hoặc C: chỉ chia hết cho 2. Đề cần cả hai."]},
{n:10,l:1,q:"Số nào là bội của 12?",o:"A. 6 · B. 1 · C. 4 · D. 0",
 s:[["Nhớ “bội” là gì","Bội của 12 là số <mark>chia hết cho 12</mark>: 12 × 0, 12 × 1, 12 × 2, ..."],
    ["Thử 6, 1, 4","Đều nhỏ hơn 12 và khác 0 → không chia hết cho 12."],
    ["Thử 0","<span class='calc'>12 × 0 = 0</span> → 0 là bội của 12."]],
 a:"D. 0",
 t:["Nhầm “bội” với “ước”: 6, 4, 1 là ước của 12, không phải bội.","Mẹo nhớ: bội thì to ra (nhân lên), ước thì nhỏ đi (chia ra). Riêng 0 là bội của mọi số khác 0."]},

{n:11,l:2,q:"Tam giác ABC đều cạnh 5 cm. Khẳng định nào đúng?",o:"A. AB = 4 cm · B. AC > AB · C. BC = 5 cm · D. AB < BC",
 s:[["Nhớ tam giác đều","3 cạnh <mark>bằng nhau</mark>."],
    ["Viết ra cả 3 cạnh","<span class='calc'>AB = BC = CA = 5 cm</span>"],
    ["Kiểm tra từng câu","A: 4 cm ✗ · B: “lớn hơn” ✗ · C: 5 cm ✓ · D: “nhỏ hơn” ✗"]],
 a:"C. BC = 5 cm",
 t:["Thấy dấu > hoặc < là loại ngay, vì các cạnh bằng nhau."]},
{n:12,l:2,q:"Hình nào là hình vuông? (Hình A: tam giác, B: chữ nhật, C: vuông, D: tròn)",o:"A. Hình A · B. Hình C · C. Hình D · D. Hình B",
 s:[["Nhớ dấu hiệu hình vuông","4 cạnh bằng nhau và 4 góc vuông."],
    ["Loại hình không có 4 cạnh","Tam giác (3 cạnh), hình tròn (không có cạnh) → loại."],
    ["So chữ nhật và vuông","Chữ nhật có 4 góc vuông nhưng cạnh dài, cạnh ngắn khác nhau → loại. Còn <mark>Hình C</mark>."],
    ["Tìm chữ đáp án ghi “Hình C”","Hình C nằm ở <span class='calc'>đáp án B</span>."]],
 a:"B. Hình C",
 t:["Bẫy lớn: tên hình (Hình C) khác chữ đáp án (B). Bé thấy “C” là bấm C ngay.","Nhầm hình chữ nhật với hình vuông."]},
{n:13,l:2,q:"Hình nào là lục giác đều? (Hình A: thang, B: ngũ giác, C: lục giác, D: tam giác vuông)",o:"A. Hình C · B. Hình D · C. Hình B · D. Hình A",
 s:[["Hiểu chữ “lục”","Lục = 6 → lục giác có <mark>6 cạnh</mark>. (Ngũ = 5, tứ = 4, tam = 3)"],

const out = document.getElementById('out');
const chips = document.getElementById('chips');
let filter = 'all', hintMode = false;

function card(x){
  const steps = x.s.map((s,i)=>`
    <div class="arrow" data-i="${i}"></div>
    <div class="node step" data-i="${i}"><div class="badge">B${i+1}</div><div><div class="t">${s[0]}</div><div class="d">${s[1]}</div></div></div>`).join('');
  const last = x.s.length;
  return `<article class="card" id="c${x.n}" data-l="${x.l}" data-total="${last}">
    <div class="card-top"><div class="qnum">Câu ${x.n}</div><div class="qtext"><p>${x.q}</p><div class="opts">${x.o}</div>${FIG[x.n]||''}</div></div>
    <div class="body">
      <div>
        <div class="flow">
          <div class="node start"><div class="lbl">Đề hỏi gì?</div><div>${x.q}</div></div>
          ${steps}
          <div class="arrow" data-i="${last}"></div>
          <div class="node end" data-i="${last}"><div class="lbl">Đáp án</div><div class="ans">${x.a}</div>${x.check?`<div class="check">${x.check}</div>`:''}</div>
        </div>
        <button class="hint-btn" type="button" id="btn${x.n}" hidden>Xem B1 ▾</button>
      </div>
      <aside>
        <div class="trap"><span class="lbl">Bẫy hay gặp</span><ul>${x.t.map(t=>`<li>${t}</li>`).join('')}</ul></div>
        ${x.tip?`<div class="tip"><span class="lbl">Mẹo</span>${x.tip}</div>`:''}
      </aside>
    </div>
  </article>`;
}

function render(){
  let html='';
  [1,2,3].forEach(l=>{
    if(filter!=='all' && +filter!==l) return;
    html += `<h2 class="level-head">${LV[l][0]} <small>${LV[l][1]}</small></h2><div class="list">`;
    html += Q.filter(x=>x.l===l).map(card).join('') + '</div>';
  });
  out.innerHTML = html;
  chips.innerHTML = Q.filter(x=>filter==='all'||x.l===+filter).map(x=>`<a class="chip" data-l="${x.l}" href="#c${x.n}">${x.n}</a>`).join('');
  document.querySelectorAll('.card').forEach(c=>setShown(c, hintMode?0:Infinity));
}

function setShown(c, k){
  const total = +c.dataset.total; // bước 0..total-1 là B1.., total là đáp án
  c.dataset.shown = k;
  c.querySelectorAll('[data-i]').forEach(el=>{
    const hide = +el.dataset.i >= k;
    el.classList.toggle('hidden-step', hide);
  });
  const btn = c.querySelector('.hint-btn');
  if(!hintMode){ btn.hidden = true; return; }
  btn.hidden = false;
  if(k < total){ btn.textContent = `Xem B${k+1} ▾`; btn.classList.remove('reset'); }
  else if(k === total){ btn.textContent = 'Xem đáp án ▾'; btn.classList.remove('reset'); }
  else { btn.textContent = 'Che lại, làm lại từ đầu'; btn.classList.add('reset'); }
}

out.addEventListener('click', e=>{
  const btn = e.target.closest('.hint-btn'); if(!btn) return;
  const c = btn.closest('.card'); const k = +c.dataset.shown; const total = +c.dataset.total;
  if(k > total){ setShown(c,0); return; }
  setShown(c,k+1);
  c.querySelectorAll(`[data-i="${k}"]`).forEach(el=>{el.classList.remove('reveal'); void el.offsetWidth; el.classList.add('reveal');});
});

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  filter = b.dataset.f;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed', t===b));
  render();
}));
document.getElementById('hintMode').addEventListener('change', e=>{ hintMode = e.target.checked; render(); });

render();
if(location.hash){ const el=document.querySelector(location.hash.replace(/[^#\w-]/g,'')); if(el) el.scrollIntoView(); }
</script>
